<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LIGTAS-Brgy Unified Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #E5E0D8; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    // Initialize map centering on Bacolod City (LIGTAS-Brgy project location)
    const map = L.map('map', { zoomControl: true }).setView([10.3077, 123.8941], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let markerLayerGroup = L.layerGroup().addTo(map);
    let selectionMarker = null;

    // --- USE CASE 1: RESIDENT PINNING (Reverse Geocoding) ---
    map.on('click', async function(e) {
        const { lat, lng } = e.latlng;

        // Update visual marker
        if (selectionMarker) {
            selectionMarker.setLatLng(e.latlng);
        } else {
            selectionMarker = L.marker(e.latlng, { draggable: true }).addTo(map);
        }

        // Fetch actual address using Nominatim (Free)
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`, {
                headers: { 'User-Agent': 'LIGTAS-Brgy-Capstone' }
            });
            const data = await response.json();
            const address = data.display_name || `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`;

            // Send back to Java Controller (MapPickerController)
            if (window.javaConnector) {
                window.javaConnector.setAddress(address, lat, lng);
            }
        } catch (error) {
            window.javaConnector.setAddress(`Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`, lat, lng);
        }
    });

    // --- USE CASE 2: EVACUATION CENTER DISPLAY ---
    function clearMarkers() {
        markerLayerGroup.clearLayers();
    }

    function addCenterMarker(id, lat, lng, name, occupancy, capacity, isActive, status) {
        let color, borderColor;

        // Status Logic: Red for Inactive, Yellow for Full, Green for Active
        if (!isActive || status === 'Inactive') {
            color = '#6b7280';       // Red
            borderColor = '#4b5563';
        } else if (status === 'Full') {
            color = '#ef4444';       // Yellow/Amber
            borderColor = '#dc2626';
        } else {
            color = '#22c55e';       // Green
            borderColor = '#16a34a';
        }

        const percent = capacity > 0 ? Math.round((occupancy / capacity) * 100) : 0;

        // Progress Bar Logic: Green < 90%, Yellow 90-100%, Red > 100%
        let barColor = '#22c55e'; // Default Green
        if (percent >= 90 && percent <= 100) {
            barColor = '#f59e0b'; // Yellow
        } else if (percent > 100) {
            barColor = '#ef4444'; // Red
        }

        const statusLabel = !isActive ? 'Inactive'
            : status === 'Full' ? 'Full'
                : 'Available';

        const icon = L.divIcon({
            className: '',
            html: `
            <div style="
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
            ">
                <div style="
                    background: ${color};
                    border: 3px solid ${borderColor};
                    border-radius: 50% 50% 50% 0;
                    transform: rotate(-45deg);
                    width: 28px;
                    height: 28px;
                    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                ">
                    <div style="
                        transform: rotate(45deg);
                        color: white;
                        font-size: 11px;
                        font-weight: bold;
                        line-height: 1;
                    ">A</div>
                </div>
                <div style="
                    width: 4px;
                    height: 6px;
                    background: ${borderColor};
                    margin-top: -1px;
                "></div>
            </div>`,
            iconSize: [28, 40],
            iconAnchor: [14, 40],
            popupAnchor: [0, -42]
        });

        const marker = L.marker([lat, lng], { icon });

        marker.bindPopup(`
        <div style="
            font-family: sans-serif;
            min-width: 180px;
            padding: 4px;
        ">
            <div style="
                font-size: 14px;
                font-weight: 700;
                color: #111827;
                margin-bottom: 6px;
            ">${name}</div>

            <div style="
                display: inline-block;
                padding: 2px 10px;
                border-radius: 12px;
                font-size: 11px;
                font-weight: 600;
                background: ${color}22;
                color: ${color};
                border: 1px solid ${color};
                margin-bottom: 8px;
            ">${statusLabel}</div>

            <div style="margin-bottom: 4px;">
                <div style="
                    display: flex;
                    justify-content: space-between;
                    font-size: 11px;
                    color: #6b7280;
                    margin-bottom: 2px;
                ">
                    <span>Occupancy</span>
                    <span>${occupancy} / ${capacity}</span>
                </div>
                <div style="
                    width: 100%;
                    height: 6px;
                    background: #e5e7eb;
                    border-radius: 99px;
                    overflow: hidden;
                ">
                    <div style="
                        width: ${Math.min(percent, 100)}%;
                        height: 100%;
                        background: ${barColor};
                        border-radius: 99px;
                        transition: width 0.3s;
                    "></div>
                </div>
            </div>

            <div style="
                font-size: 11px;
                color: #9ca3af;
                text-align: right;
                margin-top: 4px;
            ">${percent}% filled</div>
        </div>
    `);

        markerLayerGroup.addLayer(marker);
    }

    // Fix for JavaFX "Grey Box" rendering issue
    function fixMapSize() {
        setTimeout(() => {
            map.invalidateSize();
            // Update this line to match CIT-U as well
            map.setView([10.3077, 123.8941], 15, { animate: false });
        }, 300);
    }

    async function searchAddress(query) {
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`);
            const data = await response.json();
            if (data && data.length > 0) {
                const result = data[0];
                const lat = parseFloat(result.lat);
                const lon = parseFloat(result.lon);

                // Move map and marker
                map.flyTo([lat, lon], 17);
                if (selectionMarker) {
                    selectionMarker.setLatLng([lat, lon]);
                } else {
                    selectionMarker = L.marker([lat, lon]).addTo(map);
                }

                // Update Java side with the "official" formatted address
                window.javaConnector.setAddress(result.display_name, lat, lon);
            }
        } catch (e) {
            console.error("Search failed", e);
        }
    }

    // Center view on specific coordinates (For focusing on a center)
    function focusLocation(lat, lng) {
        map.flyTo([lat, lng], 17);
    }
</script>
</body>
</html>
